name: CI

# Verifies every pull request against `main`, and re-verifies `main` after a merge.
# `prepublishOnly` still runs build + tests inside the release workflow, so this job
# duplicates neither step's intent for releases — it gates ordinary changes.
# See .github/workflows/publish.yml for the trusted-publishing release path.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Bilingual docs rule: one language per file, pairs and switchers
      # complete. Needs no dependencies — Node strips the types — so it gates
      # before the install step.
      - name: Docs language
        run: node scripts/check-docs-language.ts

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      # pnpm install runs the package's `prepare` script (tsc build), which the
      # typecheck and test steps then verify. `--frozen-lockfile` proves the
      # lockfile matches package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test
