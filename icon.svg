<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
    <linearGradient id="tf-fish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="50%" stop-color="#FFA07A" />
      <stop offset="100%" stop-color="#FFD93D" />
    </linearGradient>
    <linearGradient id="tf-search" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E65FF" />
      <stop offset="100%" stop-color="#92EFFD" />
    </linearGradient>
    <filter id="tf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#tf-bg)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#tf-search)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Magnifying glass rim (Search concept) -->
  <circle cx="58" cy="58" r="32" fill="none" stroke="url(#tf-search)" stroke-width="6.5" filter="url(#tf-glow)" />
  <line x1="82" y1="82" x2="106" y2="106" stroke="url(#tf-search)" stroke-width="7" stroke-linecap="round" />

  <!-- TinyFish body swimming inside search lens -->
  <path d="M 40 58 C 45 46, 68 47, 76 58 C 68 69, 45 70, 40 58 Z" fill="url(#tf-fish)" />
  <!-- Fish tail -->
  <path d="M 38 58 L 26 48 L 30 58 L 26 68 Z" fill="url(#tf-fish)" />
  <!-- Fish dorsal fin -->
  <path d="M 54 48 Q 62 44 65 49 Z" fill="#FFA07A" />
  <!-- Fish eye & reflection bubble -->
  <circle cx="68" cy="55" r="2.5" fill="#FFFFFF" />
  <circle cx="69" cy="54.5" r="1.2" fill="#203A43" />
  <!-- Ocean / Web Ripple waves -->
  <path d="M 46 64 Q 54 67 62 64" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <circle cx="78" cy="45" r="2.5" fill="#92EFFD" opacity="0.75" />
  <circle cx="83" cy="38" r="1.5" fill="#92EFFD" opacity="0.6" />
</svg>
