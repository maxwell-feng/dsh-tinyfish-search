# DSH publishes prereleases continuously, so every `@deepseek-ai/*` revision this
# plugin pins is younger than pnpm's minimum-release-age gate. Each pinned
# package@version is exempted explicitly — pnpm accepts exact versions (or
# `||` unions), never ranges. Refresh this list with the lockfile when bumping.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.2.0-alpha.1'
  - '@deepseek-ai/cosmokit@1.10.0-alpha.1'
  - '@deepseek-ai/dsh-brand@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-credentials@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-error@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-launch-environment@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-llm@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-package-manifest@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-timeout@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-util-values@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-web@0.2.3-alpha.2'
  - '@deepseek-ai/schemastery@3.20.0-alpha.1'
